{% extends "base.html" %}
{% block title %} edituser {% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center mt-5">
    <div class="shadow-lg p-4 mt-5 bg-light bg-body rounded-3" style="width: 40%;">
        <h3 class="text-center mb-2">User Details</h3>
        <form method="post">
            <div class="mb-3">
                <label for="name" class="form-label">Name:</label>
                <input name="name" type="text" value="{{user.name}}" class="form-control" required />
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input name="password" type="text" value="{{user.password}}" class="form-control" required />
            </div>
            <div class="text-end">
                <button type="submit" class="btn btn-success">Edit</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% extends "base1.html" %}
{% block title %} signup {% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center mt-5">
    <div class="shadow-lg p-4 mt-5 bg-body rounded-3" style="width: 30%;">
        <h3 class="text-center mb-2"> Create Account </h3>
        <form method="post">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input name="name" , type="text" class="form-control" placeholder="Enter your name" required />
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Email</label>
                <input name="email" , type="email" class="form-control" placeholder="Enter your email" required />
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input name="password" , type="password" class="form-control" maxlength=15
                    placeholder="Create your password" required />
            </div>
            <div class="text-end">
                <button type="submit" class="btn btn-primary">Sign up</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

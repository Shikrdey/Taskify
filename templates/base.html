<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css">
  </head>

<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="/homepage"><i class="bi bi-card-checklist"></i> Taskify</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav">
          <span class="active fs-5" style="font-weight:400;">Welcome, <a href="/user" style="font-weight: 400; text-decoration: none; color: black;">{{ name| upper }}!</a></span>
        </div>
        </div>
        </div>
        <!-- <div style="display: flex; justify-content: space-evenly;"> -->
          <a href="/task" class="btn btn-success" style="width:90px; margin-right: 10px;"><i class="bi bi-patch-plus"></i> Task</a>
          <a href="/category" class="btn btn-secondary" style="margin-right: 10px;">Category</a>
          <a href="/logout" class="btn btn-danger" style="margin-right: 10px;">Logout</a>
        
      
    <!-- </div> -->
  </nav>
  <div class="d-flex justify-content-center mt-1">
    {% with messages= get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
    <div class="alert alert-{{category}} alert-dismissible fade show w-50 d-flex justify-content-center p-2"
      role="alert">
      {{ msg }}
      <button type="button" class="btn-close p-2 mt-1" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
    {% endwith %}
  </div>
  <div class="container">
  {% block content %}
  {% endblock %}
  </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
  integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
  integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

</html>
